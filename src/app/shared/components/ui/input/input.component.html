<div class="app-input" [class.app-input--erro]="mostrarErro()">
  <label [for]="id">{{ rotulo() }}</label>
  <input
    [id]="id"
    [type]="tipo()"
    [placeholder]="placeholder()"
    [value]="valor()"
    [disabled]="desabilitado()"
    (input)="aoDigitar($event)"
    (blur)="aoPerderFoco()"
  />
  @if (mostrarErro() && mensagemErro()) {
    <div class="app-input__erro">{{ mensagemErro() }}</div>
  }
</div>
